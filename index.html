<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fliegenhirn DJ</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#090a0e;--panel:#10131a;--line:#1c212c;--text:#e9ecf3;--mute:#8d95a6;--amber:#f0b860;--teal:#5fd6c0;--spike:#e8c873;--pink:#ff3d8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#stage{position:relative;flex:1 1 0;min-height:0}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%}
#bar{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#bar>*{pointer-events:auto}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 8px 0 2px;font-weight:700}
button,.btn{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:rgba(20,24,33,.85);border:1px solid #2a3140;border-radius:6px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover,.btn:hover{background:#1d2330;border-color:#3b4558}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--teal);border-color:var(--teal);color:#06241f}
button.primary:hover{background:#7be3d0}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.sl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:rgba(20,24,33,.85);border:1px solid #2a3140;border-radius:6px;padding:5px 10px}
.sl input{width:84px;accent-color:var(--teal);cursor:pointer}
.votes{display:flex;gap:4px;align-items:center}
.vote{display:flex;align-items:center;justify-content:center;width:40px;height:34px;padding:0}
.vote.up:hover:not(:disabled){color:#06241f;background:var(--teal);border-color:var(--teal)}
.vote.down:hover:not(:disabled){color:#fff;background:#c8324e;border-color:#c8324e}
.vote:active:not(:disabled){transform:translateY(1px)}
#bEvo{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600;font-size:12px}
#list{position:absolute;right:12px;top:58px;bottom:12px;width:min(470px,calc(100% - 24px));overflow:auto;background:rgba(13,16,22,.96);border:1px solid #2a3140;border-radius:10px;padding:12px;z-index:30}
#list .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}#list .lh b{margin-right:auto;font-size:14px}
#list .lhint{margin:0 0 10px;font-size:12px;color:var(--mute);line-height:1.45}
#list .li{border-top:1px solid #1f2531;padding:9px 6px 10px;border-left:3px solid transparent}#list .li.now{border-left-color:var(--teal);background:rgba(95,214,192,.06)}
#list .lt{font-weight:650;font-size:13.5px;line-height:1.35}#list .lt span{display:inline-block;min-width:20px;color:var(--mute);font-variant-numeric:tabular-nums}#list .lt i{color:var(--mute);font-style:normal}
#list .ls{font-size:12px;color:var(--mute);margin-top:2px}#list .ls em{color:var(--amber);font-style:normal}#list .ch{color:var(--teal)}
#list .lb{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}#list .lb span{font-size:11.5px;color:var(--mute);margin-left:6px}
#list button{font-size:12px;padding:5px 9px}#list .pl{background:var(--teal);border-color:var(--teal);color:#06241f}#list .pl:hover{background:#7be3d0}
#list button[data-a=up],#list button[data-a=down]{display:inline-flex;align-items:center;padding:5px 7px}#list button.on{color:#06241f;background:var(--teal);border-color:var(--teal)}#list button[data-a=down].on{color:#fff;background:#c8324e;border-color:#c8324e}
#stat{margin-left:auto;font-size:12px;color:var(--mute);background:rgba(20,24,33,.85);border-radius:6px;padding:6px 10px;font-variant-numeric:tabular-nums}
#log{position:absolute;left:12px;bottom:10px;max-width:min(560px,70%);font-size:12.5px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
#log div{background:rgba(9,10,14,.72);border-left:2px solid var(--teal);padding:3px 8px;border-radius:0 4px 4px 0;color:#cfd5e2}
#log div:not(:last-child){opacity:.6}
#log div.d0{border-color:var(--amber)}
#panels{display:grid;grid-template-columns:1fr 1.15fr 1.35fr 1.35fr;gap:1px;background:var(--line);border-top:1px solid var(--line);flex:0 0 auto}
.p{background:var(--panel);padding:10px 12px 12px;min-width:0}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c9cedb;display:flex;justify-content:space-between;gap:8px}
.lab span:last-child{color:var(--mute);font-weight:600}
#brainC,#rasterC{display:block;width:100%;height:132px;margin-top:6px}
#spk{font-size:12px;font-weight:700;color:var(--spike);margin-top:4px;font-variant-numeric:tabular-nums}
#cls{font-size:11.5px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .name{font-size:15px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.deck canvas{display:block;width:100%;height:44px;margin:6px 0;border-radius:3px;background:#07080b}
.fad{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.fad .tr{flex:1;height:4px;background:#232936;border-radius:2px;position:relative}
.fad .fi{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c)}
.fad .fi::after{content:"";position:absolute;right:-3px;top:-4px;width:6px;height:12px;border-radius:2px;background:var(--c)}
.fad b{color:var(--c);min-width:38px;text-align:right;font-size:12px}
.knobs{display:flex;justify-content:space-around;margin-top:8px}
.knob{text-align:center;font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.knob svg{display:block;margin:0 auto 1px;width:34px;height:34px}
.knob i{display:block;font-style:normal;color:var(--text);font-weight:600;font-size:11.5px;letter-spacing:0;font-variant-numeric:tabular-nums}
.deck[data-d="0"]{--c:var(--amber)} .deck[data-d="1"]{--c:var(--teal)}
.deck .lab span:first-child{color:var(--c)}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,10,14,.82);z-index:20}
#gate .box{max-width:520px;padding:26px 28px;background:var(--panel);border:1px solid #2a3140;border-radius:10px}
#gate h2{margin:0 0 8px;font-size:22px}
#gate p{margin:0 0 12px;color:#c3c9d6;line-height:1.55}
#gate small:empty{display:none}
#gate small{display:block;color:var(--mute);margin-top:12px;line-height:1.5}
#prog{height:5px;background:#232936;border-radius:3px;margin:14px 0;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}
#gate button{font-size:15px;padding:10px 18px}
#paceRow{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:#c3c9d6;font-size:14px}
#pace{font:inherit;color:var(--text);background:#1a1f2b;border:1px solid #2a3140;border-radius:6px;padding:7px 10px;cursor:pointer}
#out{display:none}
/* Video-Modus: die normale Seite liegt unsichtbar in fester Groesse daneben und liefert nur die Bilder fuer #out */
body.video{background:#000}
body.video #out{display:block;position:fixed;inset:0;margin:auto;height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain}
body.video #app{position:fixed;left:-6000px;top:0;width:1080px;height:1930px}
body.video #stage{flex:0 0 1150px}
body.video #bar,body.video #log{display:none}
body.video #panels{grid-template-columns:520px 560px}
body.video #brainC{width:500px;height:262px}
body.video #rasterC{width:484px;height:228px}
body.video #gate{position:fixed;inset:0;z-index:50}
@media (max-width:1000px){#panels{grid-template-columns:1fr 1fr}#brainC,#rasterC{height:96px}h1{display:none}}
@media (max-width:560px){.sl{display:none}#stat{display:none}}
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<div id="app">
  <div id="stage">
    <div id="view"></div>
    <div id="bar">
      <button id="bPlay" disabled>Pause</button>
      <button id="bMix" disabled>Mix</button>
      <button id="bMode" hidden title="Plan oder spontan">Plan</button>
      <button id="bList" hidden>Übergänge</button>
      <span class="votes">
        <button id="bUp" class="vote up" disabled aria-label="Daumen hoch"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
        <button id="bDown" class="vote down" disabled aria-label="Daumen runter"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>
        <button id="bEvo" title="Zurücksetzen"><span id="evo">Gen 1</span></button>
      </span>
      <label class="btn">+ Songs<input id="files" type="file" accept="audio/*" multiple></label>
      <label class="sl">Lautstärke <input id="sVol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <label class="sl">Erregung <input id="sGain" type="range" min="0.6" max="2" step="0.05" value="1.2"></label>
      <label class="sl">Spontan <input id="sNoise" type="range" min="0" max="0.3" step="0.005" value="0.05"></label>
      <div id="stat">–</div>
    </div>
    <div id="log" aria-live="polite"></div>
    <div id="list" hidden></div>
    <div id="gate"><div class="box">
      <div id="prog"><i></i></div>
      <label id="paceRow" hidden>Wechsel alle <select id="pace"><option value="30">30 s</option><option value="45" selected>45 s</option><option value="75">75 s</option><option value="110">2 min</option></select></label>
      <button id="bStart" class="primary" disabled>Lade Connectome …</button>
      <small></small>
    </div></div>
  </div>
  <div id="panels">
    <div class="p"><div class="lab"><span>Neural Activity</span><span id="simv"></span></div><canvas id="brainC"></canvas></div>
    <div class="p"><div class="lab"><span>Spike Raster</span></div><canvas id="rasterC"></canvas><div id="spk">0 spikes / 20 ms</div></div>
    <div class="p deck" data-d="0"></div>
    <div class="p deck" data-d="1"></div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
